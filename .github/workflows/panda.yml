name: panda-contributions

on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours
  workflow_dispatch:           # "Run workflow" button
  push:
    branches: [main]
    paths: [".github/scripts/generate_panda.py"]

permissions:
  contents: write

jobs:
  panda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate panda from my real contributions
        run: python .github/scripts/generate_panda.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: pankajsinghdeveloper26
      - name: Commit if changed
        run: |
          git config user.name "panda-bot"
          git config user.email "panda-bot@users.noreply.github.com"
          git add assets/panda-contrib.svg
          git diff --cached --quiet || (git commit -m "chore: update panda contributions" && git push)
